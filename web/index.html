<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InterviewGenie</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#14171f; --line:#262b38; --text:#e8ecf4;
    --dim:#8b93a7; --accent:#5b8cff; --good:#35c37d; --bad:#e5544b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex; flex-direction:column;
  }
  header{
    display:flex; align-items:center; gap:8px; padding:9px 12px;
    background:var(--panel); border-bottom:1px solid var(--line);
  }
  header b{font-size:14px; letter-spacing:-.01em}
  .spacer{flex:1}
  .pill{
    font-size:11px; font-weight:600; padding:3px 8px; border-radius:999px;
    background:#1b1f29; border:1px solid var(--line); color:var(--dim);
  }
  .pill.ok{color:var(--good);border-color:#23492f;background:#10251a}
  .pill.bad{color:var(--bad);border-color:#4a2320;background:#251110}
  button{
    font:inherit; font-size:13px; color:var(--text); background:#1b1f29;
    border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer;
  }
  button:hover{background:#232936}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:#4a7ef0}
  main{flex:1; overflow:auto; padding:16px; max-width:900px; width:100%; margin:0 auto}
  label{display:block; font-size:11px; font-weight:700; letter-spacing:.08em;
        text-transform:uppercase; color:var(--dim); margin:0 0 6px}
  textarea,input[type=text]{
    width:100%; font:inherit; color:var(--text); background:var(--bg);
    border:1px solid var(--line); border-radius:8px; padding:9px 10px; resize:vertical;
  }
  textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .row{display:flex; gap:8px; align-items:flex-end; margin-bottom:14px; flex-wrap:wrap}
  .row>div{flex:1; min-width:150px}
  .actions{display:flex; gap:8px; margin:10px 0 18px; align-items:center}
  .hint{font-size:12px; color:var(--dim)}
  #answer{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:16px 18px; font-size:19px; line-height:1.55; white-space:pre-wrap;
    word-break:break-word; min-height:120px;
  }
  #answer.empty{color:var(--dim); font-size:15px}
  #meta{font-size:12px; color:var(--dim); margin-top:9px; min-height:18px}
  .err{color:var(--bad); font-size:13px; margin-top:10px; white-space:pre-wrap}
  kbd{background:#1b1f29;border:1px solid var(--line);border-radius:4px;
      padding:1px 5px;font-size:11px;font-family:ui-monospace,monospace}
</style>
</head>
<body>

<header>
  <b>InterviewGenie</b>
  <span id="status" class="pill">checking…</span>
  <span class="spacer"></span>
  <button id="mic" title="Optional: dictate the question. Hidden if unsupported." hidden>🎙 Dictate</button>
  <button id="clear">Clear</button>
</header>

<main>
  <div class="row">
    <div>
      <label for="role">Role</label>
      <input id="role" type="text" value="Senior Software Engineer" placeholder="e.g. Backend Engineer">
    </div>
    <div>
      <label for="company">Company</label>
      <input id="company" type="text" value="Stripe" placeholder="e.g. Stripe">
    </div>
  </div>

  <label for="question">The interviewer's question</label>
  <textarea id="question" rows="3" placeholder="e.g. Tell me about a time you had to push back on a deadline."></textarea>

  <div class="actions">
    <button id="ask" class="primary">Answer</button>
    <span class="hint"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> to answer</span>
  </div>

  <div id="answer" class="empty">Your answer appears here.</div>
  <div id="meta"></div>
  <div id="error" class="err"></div>
</main>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var answer = $("answer"), meta = $("meta"), err = $("error");

  function setStatus(text, kind){
    var el = $("status");
    el.textContent = text;
    el.className = "pill" + (kind ? " " + kind : "");
  }

  // Is the backend alive? Cheap GET, no side effects.
  function check(){
    fetch("/api/health", {cache:"no-store"})
      .then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function(){ setStatus("ready", "ok"); })
      .catch(function(){ setStatus("server down", "bad"); });
  }

  function showError(message){
    err.textContent = message;
  }

  function answerQuestion(){
    var text = $("question").value.trim();
    if(!text){ $("question").focus(); return; }
    err.textContent = "";
    answer.className = "";
    answer.textContent = "Thinking…";
    meta.textContent = "";

    fetch("/api/question", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        text: text,
        profile: {
          target_role: $("role").value.trim(),
          target_company: $("company").value.trim()
        }
      })
    })
    .then(function(r){
      if(!r.ok) throw new Error("server returned " + r.status);
      return r.json();
    })
    .then(function(data){
      var body = data.response || data;
      var text = body.text || "(no answer)";
      answer.textContent = text;
      answer.className = "";
      var bits = [];
      if(body.strategy) bits.push(body.strategy);
      if(body.scorecard && body.scorecard.overall != null)
        bits.push("score " + Number(body.scorecard.overall).toFixed(2));
      if(body.latency_ms) bits.push(Math.round(body.latency_ms) + "ms");
      meta.textContent = bits.join(" · ");
    })
    .catch(function(e){
      answer.className = "empty";
      answer.textContent = "";
      showError("Could not reach the server. Start it with:\n\n" +
                "    python3 -m interviewgenie serve --port 8422\n\n" +
                "then reload this page.  (" + e.message + ")");
    });
  }

  // Optional dictation. Only shown when the browser actually supports it,
  // and never required: typing always works.
  function initMic(){
    var R = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!R) return;                       // button stays hidden
    var btn = $("mic");
    btn.hidden = false;
    var rec = null, on = false;
    btn.addEventListener("click", function(){
      if(on && rec){ on = false; rec.stop(); btn.textContent = "🎙 Dictate"; return; }
      rec = new R();
      rec.continuous = false;
      rec.interimResults = false;
      rec.lang = "en-US";
      rec.onresult = function(e){
        var t = e.results[0][0].transcript.trim();
        if(t){ $("question").value = t; answerQuestion(); }
      };
      rec.onerror = function(){ on = false; btn.textContent = "🎙 Dictate"; };
      rec.onend = function(){ on = false; btn.textContent = "🎙 Dictate"; };
      on = true;
      btn.textContent = "⏹ Listening";
      try { rec.start(); } catch(e){ on = false; }
    });
  }

  $("ask").addEventListener("click", answerQuestion);
  $("clear").addEventListener("click", function(){
    $("question").value = ""; answer.className = "empty";
    answer.textContent = "Your answer appears here.";
    meta.textContent = ""; err.textContent = "";
  });
  $("question").addEventListener("keydown", function(e){
    if((e.ctrlKey || e.metaKey) && e.key === "Enter") answerQuestion();
  });

  check();
  initMic();
  setInterval(check, 15000);
})();
</script>
</body>
</html>
